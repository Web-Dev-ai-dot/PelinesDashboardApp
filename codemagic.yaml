# Build validation only. No triggers, signing integration, or publishing section.
# See docs/ios-testflight-setup.md before the first manual run.
workflows:
  ios-staging-build:
    name: iOS staging unsigned build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: 3.47.2
      xcode: "26.6"
      groups:
        - pelines_staging
    scripts:
      - name: Verify checkout and toolchain
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          git rev-parse HEAD
          flutter --version
          xcodebuild -version
      - name: Resolve Flutter dependencies
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          flutter pub get --enforce-lockfile
      - name: Analyze and test
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          flutter analyze
          flutter test
      - name: Compile unsigned staging app with SwiftPM
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          # Do not echo secrets or archive this JSON / generated xcconfig files.
          export STAGING_DEFINE_FILE="$CM_BUILD_DIR/build/ios-ci/staging-defines.json"
          trap 'rm -f "$STAGING_DEFINE_FILE"' EXIT
          python3 tools/write_staging_defines.py
          flutter build ios --release --no-codesign --config-only \
            --dart-define-from-file="$STAGING_DEFINE_FILE"
          xcodebuild -resolvePackageDependencies \
            -workspace ios/Runner.xcworkspace -scheme Runner \
            -configuration Release CODE_SIGNING_ALLOWED=NO
          flutter build ios --release --no-codesign \
            --dart-define-from-file="$STAGING_DEFINE_FILE"
          plutil -lint build/ios/iphoneos/Runner.app/Info.plist
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' build/ios/iphoneos/Runner.app/Info.plist)" = "com.tkr.pelinesadmin"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleDisplayName' build/ios/iphoneos/Runner.app/Info.plist)" = "Pelines Admin"
          ditto -c -k --sequesterRsrc --keepParent \
            build/ios/iphoneos/Runner.app build/ios/unsigned-pelines-admin-staging.zip
    artifacts:
      - build/ios/unsigned-pelines-admin-staging.zip
    # Deliberately no publishing. This unsigned .app is not installable through
    # TestFlight. A separately authorized signed IPA workflow comes later.
